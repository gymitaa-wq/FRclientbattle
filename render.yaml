services:
  - type: web
    name: frclientbattle
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run streamlit_streamlined.py --server.port $PORT --server.address 0.0.0.0
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: STREAMLIT_SHARING_MODE
        value: production
      - key: GOOGLE_OAUTH_REDIRECT_URI
        value: https://frclientbattle.onrender.com
      - key: DATABASE_URL
        value: sqlite:////data/simulation_data.db
    disk:
      name: frclientbattle-disk
      mountPath: /data
      sizeGB: 1
    autoDeploy: true  # Changed from false - now auto-deploys on push
